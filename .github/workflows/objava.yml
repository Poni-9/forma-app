name: Objava
on:
  push:
    paths: ['.github/workflows/objava.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  ID: 1CQ3Kw5dbd9QANl1DYkk6zZqGOIw-RLtN
  SHA: ea2963a080874324d03e5abe4b09f7a161e7402ecdaaa06e75c68cc2540a3667
jobs:
  objava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          curl -fsSL -o p.zip "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
          echo "$SHA  p.zip" | sha256sum -c -
          unzip -o -q p.zip -d .
          rm p.zip
          test -f googleac28b8b3118cc9e4.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html sw.js
          git diff --cached --quiet || git commit -m "objava prek Actions (zip $ID)"
          git push
